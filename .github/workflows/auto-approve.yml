name: Auto-approve

# Approves low-risk PRs from code owners as github-actions[bot]. The rules live
# in .github/scripts/auto-approve.mjs. This workflow runs on the default branch
# (workflow_run), never checks out or runs PR code, and holds no secrets.
#
# Repo variable AUTO_APPROVE_MODE: off | shadow (default) | on.
# Requires the repo setting "Allow GitHub Actions to create and approve pull
# requests" for `on`.

on:
  workflow_run:
    workflows: ['Lexical Tests', 'Lexical Tests (Extended)']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to evaluate'
        required: true

permissions: {}

concurrency:
  group: auto-approve-${{ github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: false

jobs:
  auto-approve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      # Default branch only: the rules and CODEOWNERS come from trusted code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Evaluate
        run: node .github/scripts/auto-approve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ inputs.pr }}
          MODE: ${{ vars.AUTO_APPROVE_MODE || 'shadow' }}
          AUTO_APPROVE_OWN_CHECK: auto-approve
          AUTO_APPROVE_REQUIRED_CHECKS: unit # sandbox only
